<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>福利金登录</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #667085;
      --line: #e4e7ec;
      --accent: #e60012;
      --accent-soft: #fff1f0;
      --ok: #12b76a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 420px at 100% -10%, #ffe8e6 0%, transparent 55%),
        radial-gradient(700px 360px at -10% 110%, #e8f1ff 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .panel {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 12px 40px rgba(31, 42, 55, 0.08);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 10px; font-size: 1.55rem; letter-spacing: 0.01em; }
    p { color: var(--muted); line-height: 1.65; margin: 0 0 18px; font-size: 0.95rem; }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .field { margin-bottom: 18px; }
    input[type="number"],
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 14px;
      font-size: 1.05rem;
      color: var(--text);
      outline: none;
      background: #fff;
    }
    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: #f5a09a;
      box-shadow: 0 0 0 3px rgba(230, 0, 18, 0.12);
    }
    .field-hint {
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px 16px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff3b30, #e60012);
      cursor: pointer;
      min-height: 52px;
    }
    button:disabled { opacity: 0.65; cursor: wait; }
    .hint { margin-top: 14px; font-size: 0.9rem; color: var(--muted); word-break: break-all; }
    .err { color: #d92d20; }
    .nav {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
    }
    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="brand">福利金账号</div>
    <h1>登录网易账号</h1>
    <p>先填写买家昵称与抢购次数，再开始登录。成功次数达到设定值后，该账号对应等级将不再参与抢购。</p>
    <div class="field">
      <label for="buyerNickname">买家昵称</label>
      <input id="buyerNickname" type="text" maxlength="128" placeholder="例如：张三店铺" />
      <div class="field-hint">选填，用于管理识别；旧账号默认为空，可在管理页修改。</div>
    </div>
    <div class="field">
      <label for="targetCount">抢购次数 <span style="color:var(--accent)">*</span></label>
      <input id="targetCount" type="number" min="1" max="9999" step="1" required placeholder="例如 1" />
      <div class="field-hint">必填，整数，至少为 1。旧账号未填写时默认为 1 次。</div>
    </div>
    <button id="btn" type="button">开始登录</button>
    <div class="hint" id="msg"></div>
    <div class="nav"><a href="/accounts.html">查看 / 管理全部账号</a></div>
  </div>
  <script>
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    const targetInput = document.getElementById('targetCount');
    const buyerInput = document.getElementById('buyerNickname');
    btn.addEventListener('click', async () => {
      const raw = String(targetInput.value || '').trim();
      if (!raw) {
        msg.className = 'hint err';
        msg.textContent = '请填写抢购次数';
        targetInput.focus();
        return;
      }
      const targetCount = Number(raw);
      if (!Number.isFinite(targetCount) || targetCount < 1 || !Number.isInteger(targetCount)) {
        msg.className = 'hint err';
        msg.textContent = '抢购次数须为大于等于 1 的整数';
        targetInput.focus();
        return;
      }
      const buyerNickname = String(buyerInput.value || '').trim();
      btn.disabled = true;
      msg.className = 'hint';
      msg.textContent = '正在创建登录会话…';
      try {
        const res = await fetch('/api/login/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetCount, buyerNickname }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.message || '创建失败');
        location.href = data.url;
      } catch (e) {
        msg.className = 'hint err';
        msg.textContent = e.message || String(e);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
