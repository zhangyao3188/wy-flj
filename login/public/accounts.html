<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>账号管理 - 福利金</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #667085;
      --line: #e4e7ec;
      --accent: #e60012;
      --accent-soft: #fff1f0;
      --ok: #12b76a;
      --warn: #f79009;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 420px at 100% -10%, #ffe8e6 0%, transparent 55%),
        radial-gradient(700px 360px at -10% 110%, #e8f1ff 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      padding: 20px 16px 40px;
    }
    .wrap { width: min(1680px, calc(100% - 32px)); margin: 0 auto; }
    .top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 10px;
    }
    h1 { margin: 0 0 6px; font-size: 1.55rem; }
    .sub { color: var(--muted); margin: 0; font-size: 0.92rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 40px;
    }
    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, #ff3b30, #e60012);
    }
    .btn-ghost {
      color: var(--text);
      background: #fff;
      border: 1px solid var(--line);
    }
    .btn-danger { color: #fff; background: #d92d20; }
    .btn-warn { color: #fff; background: var(--warn); }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .btn-sm { padding: 3px 6px; min-height: 26px; font-size: 0.74rem; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .filters label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-right: 4px;
    }
    .filters input,
    .filters select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.92rem;
      min-height: 38px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    .filters input { width: min(200px, 42vw); }
    .filters input:focus,
    .filters select:focus {
      border-color: #f5a09a;
      box-shadow: 0 0 0 3px rgba(230, 0, 18, 0.1);
    }
    .chip {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .chip strong { color: var(--text); }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(31, 42, 55, 0.06);
      overflow: hidden;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1280px; table-layout: fixed; }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      font-size: 0.88rem;
      vertical-align: middle;
      word-break: break-word;
    }
    th {
      background: #f9fafb;
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    col.c-mobile { width: 128px; }
    col.c-buyer { width: 140px; }
    col.c-act { width: 132px; }
    col.c-max { width: 64px; }
    col.c-levels { width: 220px; }
    col.c-status { width: 88px; }
    col.c-today { width: 72px; }
    col.c-last { width: 128px; }
    col.c-login { width: 128px; }
    col.c-ops { width: 220px; }
    .mono {
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 0.84rem;
    }
    .muted { color: var(--muted); }
    .cell-sub { font-size: 0.72rem; margin-top: 3px; line-height: 1.35; color: var(--muted); }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .tag-ok { background: #ecfdf3; color: #027a48; }
    .tag-done { background: #fff6ed; color: #b54708; }
    .tag-offline { background: #fef3f2; color: #b42318; }
    .tag-online { background: #ecfdf3; color: #027a48; }
    .tag-suspected { background: #fffaeb; color: #b54708; }
    .online-tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .levels { display: flex; flex-direction: column; gap: 6px; }
    .level-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 8px;
      width: fit-content;
      max-width: 100%;
    }
    .level-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .level-meta strong { flex-shrink: 0; }
    .level-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .level-actions .btn-sm {
      padding: 3px 6px;
      min-height: 26px;
      font-size: 0.74rem;
    }
    .row-ops {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 4px;
    }
    .row-ops .btn-sm {
      width: auto;
      flex: 0 0 auto;
      padding: 4px 6px;
      min-height: 28px;
      font-size: 0.74rem;
      white-space: nowrap;
    }
    .empty, .err, .loading { padding: 28px 16px; text-align: center; color: var(--muted); }
    .err { color: #d92d20; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      background: #1f2a37;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 20;
      max-width: min(90vw, 420px);
    }
    .toast.show { opacity: 1; }
    dialog {
      border: 0;
      border-radius: 16px;
      padding: 0;
      width: min(420px, calc(100vw - 32px));
      box-shadow: 0 20px 50px rgba(31, 42, 55, 0.2);
    }
    dialog::backdrop { background: rgba(16, 24, 40, 0.45); }
    .dlg { padding: 22px 20px; }
    .dlg h2 { margin: 0 0 8px; font-size: 1.15rem; }
    .dlg p { margin: 0 0 16px; color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
    .dlg label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 8px; }
    .dlg input, .dlg select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      margin-bottom: 16px;
      background: #fff;
    }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="brand">福利金账号</div>
        <h1>账号管理</h1>
        <p class="sub">支持同账号配置多个抢购等级（如最大 V6，同时抢 V6/V5/V4）。</p>
      </div>
      <div class="actions">
        <a class="btn btn-ghost" href="/">去登录</a>
        <button class="btn btn-ghost" id="btnCheckOnline" type="button">验证在线</button>
        <button class="btn btn-primary" id="btnRefresh" type="button">刷新</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="filters">
      <div>
        <label for="filterMobile">手机号</label>
        <input id="filterMobile" type="text" inputmode="numeric" placeholder="模糊搜索" maxlength="20" />
      </div>
      <div>
        <label for="filterStatus">状态</label>
        <select id="filterStatus">
          <option value="all">全部</option>
          <option value="active" selected>可用</option>
          <option value="completed">全部完成</option>
          <option value="today_success">当日抢购成功</option>
        </select>
      </div>
      <button class="btn btn-ghost btn-sm" id="btnClearFilter" type="button">清空筛选</button>
    </div>
    <div class="panel" id="successPanel" style="display:none;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px 0;flex-wrap:wrap">
        <strong id="successTitle">当日抢购成功订单</strong>
        <span class="muted" id="successSub" style="font-size:0.85rem"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>成功时间</th>
              <th>类型</th>
              <th>手机号</th>
              <th>买家昵称</th>
              <th>账户名称</th>
              <th>等级</th>
              <th>couponId</th>
              <th>stockId</th>
            </tr>
          </thead>
          <tbody id="successBody">
            <tr><td colspan="8" class="loading">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="table-wrap">
        <table>
          <colgroup>
            <col class="c-mobile" />
            <col class="c-buyer" />
            <col class="c-act" />
            <col class="c-max" />
            <col class="c-levels" />
            <col class="c-status" />
            <col class="c-today" />
            <col class="c-last" />
            <col class="c-login" />
            <col class="c-ops" />
          </colgroup>
          <thead>
            <tr>
              <th>手机号</th>
              <th>买家昵称</th>
              <th>账户名称</th>
              <th>最大档</th>
              <th>抢购等级</th>
              <th>状态</th>
              <th>今日成功</th>
              <th>最近成功</th>
              <th>登录时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="10" class="loading">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <dialog id="editDlg">
    <form class="dlg" id="editForm">
      <h2>编辑抢购次数</h2>
      <p id="editHint">修改后立即生效。</p>
      <label for="editTarget">抢购次数</label>
      <input id="editTarget" type="number" min="1" max="9999" step="1" required />
      <div class="dlg-actions">
        <button class="btn btn-ghost" type="button" id="editCancel">取消</button>
        <button class="btn btn-primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="addLevelDlg">
    <form class="dlg" id="addLevelForm">
      <h2>新增抢购等级</h2>
      <p id="addLevelHint">不可超过账号最大档位。</p>
      <label for="addLevelVip">等级</label>
      <select id="addLevelVip" required></select>
      <label for="addLevelTarget">抢购次数</label>
      <input id="addLevelTarget" type="number" min="1" max="9999" step="1" value="1" required />
      <div class="dlg-actions">
        <button class="btn btn-ghost" type="button" id="addLevelCancel">取消</button>
        <button class="btn btn-primary" type="submit">添加</button>
      </div>
    </form>
  </dialog>

  <dialog id="buyerDlg">
    <form class="dlg" id="buyerForm">
      <h2>编辑买家昵称</h2>
      <p id="buyerHint">用于管理识别，可留空。</p>
      <label for="buyerInput">买家昵称</label>
      <input id="buyerInput" type="text" maxlength="128" placeholder="例如：张三店铺" />
      <div class="dlg-actions">
        <button class="btn btn-ghost" type="button" id="buyerCancel">取消</button>
        <button class="btn btn-primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script>
    const tbody = document.getElementById('tbody');
    const statsEl = document.getElementById('stats');
    const toastEl = document.getElementById('toast');
    const editDlg = document.getElementById('editDlg');
    const editForm = document.getElementById('editForm');
    const editTarget = document.getElementById('editTarget');
    const editHint = document.getElementById('editHint');
    const addLevelDlg = document.getElementById('addLevelDlg');
    const addLevelForm = document.getElementById('addLevelForm');
    const addLevelVip = document.getElementById('addLevelVip');
    const addLevelTarget = document.getElementById('addLevelTarget');
    const addLevelHint = document.getElementById('addLevelHint');
    let editing = null; // { accountId, levelId }
    let editingBuyerId = null;
    let accountsCache = [];
    let successLogsCache = [];
    let todayMeta = { day: '', orders: 0, suspectedOrders: 0, accounts: 0 };
    let toastTimer = null;

    function toast(msg, ms) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2200);
    }

    /** 最近一次「验证在线」结果：id -> { online, message } */
    const onlineCheckMap = new Map();

    function fmtTime(v) {
      if (!v) return '—';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return String(v);
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function vipStatText(vipStats) {
      const entries = Object.entries(vipStats || {}).sort((a, b) => {
        const na = Number(String(a[0]).replace(/\D/g, ''));
        const nb = Number(String(b[0]).replace(/\D/g, ''));
        if (Number.isFinite(na) && Number.isFinite(nb) && na !== nb) return na - nb;
        return String(a[0]).localeCompare(String(b[0]));
      });
      return entries.map(([lv, n]) => `${lv} <strong>${n}</strong>`).join(' · ') || '暂无';
    }

    /** 按当前列表统计抢购档位（与账号表「抢购等级」一致） */
    function buildVipStats(list) {
      const vipStats = {};
      for (const a of list || []) {
        const levels = a.levels && a.levels.length ? a.levels : [{ vipLevel: a.vipLevel }];
        for (const lv of levels) {
          const key = lv.vipLevel || a.vipLevel || '未知';
          vipStats[key] = (vipStats[key] || 0) + 1;
        }
      }
      return vipStats;
    }

    function statusTag(a) {
      const main = a.completed
        ? '<span class="tag tag-done">全部完成</span>'
        : '<span class="tag tag-ok">可用</span>';
      const check = onlineCheckMap.get(Number(a.id));
      if (!check) return `<div class="online-tags">${main}</div>`;
      const onlineTag = check.online
        ? '<span class="tag tag-online" title="actInfo 在线">在线</span>'
        : `<span class="tag tag-offline" title="${escapeHtml(check.message || '离线')}">离线</span>`;
      return `<div class="online-tags">${main}${onlineTag}</div>`;
    }

    function levelRank(lv) {
      const m = String(lv || '').match(/(\d+)/);
      return m ? Number(m[1]) : 0;
    }

    function renderLevels(a) {
      const levels = a.levels && a.levels.length
        ? a.levels
        : [{ id: null, vipLevel: a.vipLevel, successCount: a.successCount || 0, targetCount: a.targetCount || 1, completed: a.completed }];
      return `<div class="levels">${levels.map((l) => `
        <div class="level-row" data-level-id="${l.id || ''}">
          <div class="level-meta">
            <strong>${escapeHtml(l.vipLevel)}</strong>
            <span class="mono">${l.successCount || 0}/${l.targetCount || 1}</span>
            ${l.completed ? '<span class="tag tag-done">完成</span>' : '<span class="tag tag-ok">抢购中</span>'}
          </div>
          <div class="level-actions">
            <button class="btn btn-ghost btn-sm" data-act="edit-level" data-level-id="${l.id || ''}" type="button">次数</button>
            <button class="btn btn-danger btn-sm" data-act="del-level" data-level-id="${l.id || ''}" type="button">删等级</button>
          </div>
        </div>
      `).join('')}</div>`;
    }

    function getFilteredAccounts() {
      const mobileQ = String(document.getElementById('filterMobile').value || '')
        .trim()
        .replace(/\s+/g, '');
      const status = document.getElementById('filterStatus').value || 'active';
      return accountsCache.filter((a) => {
        if (mobileQ) {
          const m = String(a.mobile || '');
          const buyer = String(a.buyerNickname || '');
          const act = String(a.actAccount || '');
          if (!m.includes(mobileQ) && !buyer.includes(mobileQ) && !act.includes(mobileQ)) {
            return false;
          }
        }
        if (status === 'active' && a.completed) return false;
        if (status === 'completed' && !a.completed) return false;
        if (status === 'today_success' && !(a.todaySuccessCount > 0)) return false;
        return true;
      });
    }

    function successKindTag(l) {
      if (l.kind === 'suspected') {
        return `<span class="tag tag-suspected" title="${escapeHtml(l.note || '809 已领取过本轮福利金')}">疑似成功</span>`;
      }
      return '<span class="tag tag-ok">成功</span>';
    }

    function renderTodaySuccess(a) {
      const total = a.todaySuccessCount || 0;
      if (!total) return '0';
      const suspected = a.todaySuspectedCount || 0;
      const confirmed = total - suspected;
      if (suspected > 0 && confirmed > 0) {
        return `<strong style="color:var(--ok)">${confirmed}</strong><div class="cell-sub" style="color:var(--warn)">+疑${suspected}</div>`;
      }
      if (suspected > 0) {
        return `<strong style="color:var(--warn)" title="疑似成功（809 已领取过本轮福利金）">${total}</strong><div class="cell-sub">疑似</div>`;
      }
      return `<strong style="color:var(--ok)">${total}</strong>`;
    }

    function renderSuccessRows(logs) {
      const body = document.getElementById('successBody');
      if (!logs.length) {
        body.innerHTML = '<tr><td colspan="8" class="empty">当日暂无抢购成功订单</td></tr>';
        return;
      }
      body.innerHTML = logs.map((l) => `
        <tr>
          <td class="muted">${fmtTime(l.successAt)}</td>
          <td>${successKindTag(l)}</td>
          <td class="mono">${escapeHtml(l.mobile || '—')}</td>
          <td>${escapeHtml(l.buyerNickname || '—')}</td>
          <td class="mono">${escapeHtml(l.actAccount || '—')}</td>
          <td><strong>${escapeHtml(l.vipLevel || '—')}</strong></td>
          <td class="mono" style="font-size:0.78rem">${escapeHtml(l.couponId || '—')}</td>
          <td class="mono" style="font-size:0.78rem">${escapeHtml(l.stockId || '—')}</td>
        </tr>
      `).join('');
    }

    function syncSuccessPanel() {
      const status = document.getElementById('filterStatus').value || 'active';
      const panel = document.getElementById('successPanel');
      const show = status === 'today_success';
      panel.style.display = show ? 'block' : 'none';
      if (!show) return;
      const suspectedN = successLogsCache.filter((l) => l.kind === 'suspected').length;
      document.getElementById('successTitle').textContent =
        `当日抢购成功订单（${todayMeta.day || '今日'}）`;
      document.getElementById('successSub').textContent =
        suspectedN > 0
          ? `共 ${successLogsCache.length} 笔（含疑似 ${suspectedN}）· ${todayMeta.accounts || 0} 个账号`
          : `共 ${successLogsCache.length} 笔 · ${todayMeta.accounts || 0} 个账号`;
      const mobileQ = String(document.getElementById('filterMobile').value || '')
        .trim()
        .replace(/\s+/g, '');
      const logs = !mobileQ
        ? successLogsCache
        : successLogsCache.filter((l) => {
            const blob = `${l.mobile || ''} ${l.buyerNickname || ''} ${l.actAccount || ''}`;
            return blob.includes(mobileQ);
          });
      renderSuccessRows(logs);
    }

    function renderAccountRows(list) {
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="10" class="empty">没有符合条件的账号</td></tr>';
        return;
      }
      tbody.innerHTML = list.map((a) => `
          <tr data-id="${a.id}" data-mobile="${escapeHtml(a.mobile || '')}" data-max="${escapeHtml(a.vipLevel || 'V1')}">
            <td class="mono">${a.mobile || '—'}
              ${a.isMockMobile || (a.mobile && String(a.mobile).startsWith('mock-'))
                ? '<div class="cell-sub">虚拟号</div>'
                : ''}
            </td>
            <td>
              ${escapeHtml(a.buyerNickname || '—')}
              ${a.nickname ? `<div class="cell-sub">网易: ${escapeHtml(a.nickname)}</div>` : ''}
            </td>
            <td class="mono">${escapeHtml(a.actAccount || '—')}</td>
            <td><strong>${escapeHtml(a.vipLevel || '—')}</strong></td>
            <td>${renderLevels(a)}</td>
            <td>${statusTag(a)}</td>
            <td class="mono">${renderTodaySuccess(a)}</td>
            <td class="muted">${fmtTime(a.lastSuccessAt)}</td>
            <td class="muted">${fmtTime(a.loggedInAt || a.updatedAt)}</td>
            <td>
              <div class="row-ops">
                <button class="btn btn-ghost btn-sm" data-act="sync" type="button">同步</button>
                <button class="btn btn-ghost btn-sm" data-act="edit-buyer" type="button">买家昵称</button>
                <button class="btn btn-primary btn-sm" data-act="add-level" type="button">加等级</button>
                <button class="btn btn-danger btn-sm" data-act="del" type="button">删账号</button>
              </div>
            </td>
          </tr>
        `).join('');
    }

    function applyFilters() {
      const filtered = getFilteredAccounts();
      const total = accountsCache.length;
      const filteredVipStats = buildVipStats(filtered);
      statsEl.innerHTML = [
        `<span class="chip">共 <strong>${total}</strong> 个账号</span>`,
        filtered.length !== total
          ? `<span class="chip">当前显示 <strong>${filtered.length}</strong></span>`
          : '',
        `<span class="chip">今日成功 <strong>${todayMeta.orders || 0}</strong> 笔${
          todayMeta.suspectedOrders
            ? `（疑 <strong>${todayMeta.suspectedOrders}</strong>）`
            : ''
        } / <strong>${todayMeta.accounts || 0}</strong> 账号</span>`,
        `<span class="chip">抢购档位 ${vipStatText(filteredVipStats)}</span>`,
      ].filter(Boolean).join('');
      renderAccountRows(filtered);
      syncSuccessPanel();
    }

    async function loadSuccessLogs() {
      try {
        const res = await fetch('/api/seckill-success');
        const data = await res.json();
        if (!data.ok) throw new Error(data.message || '加载成功订单失败');
        successLogsCache = data.logs || [];
        if (data.day) todayMeta.day = data.day;
      } catch (e) {
        successLogsCache = [];
        console.warn(e);
      }
    }

    async function loadAccounts() {
      tbody.innerHTML = '<tr><td colspan="10" class="loading">加载中…</td></tr>';
      try {
        const [accRes] = await Promise.all([
          fetch('/api/accounts?all=1').then((r) => r.json()),
          loadSuccessLogs(),
        ]);
        if (!accRes.ok) throw new Error(accRes.message || '加载失败');
        accountsCache = accRes.accounts || [];
        todayMeta = {
          day: accRes.today || todayMeta.day || '',
          orders: accRes.todaySuccessOrders || 0,
          suspectedOrders: accRes.todaySuspectedOrders || 0,
          accounts: accRes.todaySuccessAccounts || 0,
        };
        if (!accountsCache.length) {
          statsEl.innerHTML = `<span class="chip">共 <strong>0</strong> 个账号</span>`;
          tbody.innerHTML = '<tr><td colspan="10" class="empty">暂无账号，请先去登录入库</td></tr>';
          syncSuccessPanel();
          return;
        }
        applyFilters();
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="10" class="err">${escapeHtml(e.message || String(e))}</td></tr>`;
      }
    }

    async function apiJson(url, options) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.message || `请求失败 (${res.status})`);
      return data;
    }

    tbody.addEventListener('click', async (ev) => {
      const btn = ev.target.closest('button[data-act]');
      if (!btn) return;
      const tr = btn.closest('tr[data-id]');
      if (!tr) return;
      const accountId = tr.getAttribute('data-id');
      const mobile = tr.getAttribute('data-mobile') || accountId;
      const maxVip = tr.getAttribute('data-max') || 'V1';
      const act = btn.getAttribute('data-act');
      const levelId = btn.getAttribute('data-level-id');

      try {
        if (act === 'edit-buyer') {
          const acc = accountsCache.find((a) => String(a.id) === String(accountId));
          editingBuyerId = accountId;
          document.getElementById('buyerHint').textContent = `账号 ${mobile}`;
          document.getElementById('buyerInput').value = acc?.buyerNickname || '';
          document.getElementById('buyerDlg').showModal();
          return;
        }
        if (act === 'sync') {
          btn.disabled = true;
          btn.textContent = '同步中…';
          try {
            const data = await apiJson(`/api/accounts/${accountId}/sync`, { method: 'POST' });
            toast(data.message || '同步成功');
            await loadAccounts();
          } finally {
            btn.disabled = false;
            btn.textContent = '同步';
          }
          return;
        }
        if (act === 'add-level') {
          addingAccountId = accountId;
          const max = levelRank(maxVip);
          const used = new Set(
            (accountsCache.find((a) => String(a.id) === String(accountId))?.levels || [])
              .map((l) => String(l.vipLevel).toUpperCase())
          );
          const options = [];
          for (let i = 1; i <= Math.max(max, 1); i++) {
            const lv = `V${i}`;
            if (!used.has(lv)) options.push(lv);
          }
          addLevelVip.innerHTML = options.map((lv) => `<option value="${lv}">${lv}</option>`).join('');
          if (!options.length) {
            toast(`已无可添加等级（最大 ${maxVip}）`);
            return;
          }
          addLevelTarget.value = '1';
          addLevelHint.textContent = `账号 ${mobile}，最大档 ${maxVip}`;
          addLevelDlg.showModal();
          return;
        }
        if (act === 'edit-level') {
          if (!levelId) {
            toast('该等级尚未入库，请先重新登录同步');
            return;
          }
          const acc = accountsCache.find((a) => String(a.id) === String(accountId));
          const lv = (acc?.levels || []).find((l) => String(l.id) === String(levelId));
          editing = { accountId, levelId };
          editHint.textContent = `账号 ${mobile} / ${lv?.vipLevel || ''}（当前 ${lv?.successCount || 0}/${lv?.targetCount || 1}）`;
          editTarget.value = String(lv?.targetCount || 1);
          editDlg.showModal();
          return;
        }
        if (act === 'del-level') {
          if (!levelId) return toast('该等级尚未入库');
          if (!confirm(`确认删除该抢购等级？`)) return;
          btn.disabled = true;
          await apiJson(`/api/accounts/${accountId}/levels/${levelId}/delete`, { method: 'POST' });
          toast('已删除等级');
          await loadAccounts();
          return;
        }
        if (act === 'del') {
          if (!confirm(`确认删除账号 ${mobile}？此操作不可恢复。`)) return;
          btn.disabled = true;
          await apiJson(`/api/accounts/${accountId}/delete`, { method: 'POST' });
          toast(`已删除 ${mobile}`);
          await loadAccounts();
        }
      } catch (e) {
        toast(e.message || String(e));
        btn.disabled = false;
      }
    });

    editForm.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      if (!editing) return;
      const n = Number(editTarget.value);
      if (!Number.isFinite(n) || n < 1 || !Number.isInteger(n)) {
        toast('抢购次数须为大于等于 1 的整数');
        return;
      }
      try {
        await apiJson(`/api/accounts/${editing.accountId}/levels/${editing.levelId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetCount: n }),
        });
        editDlg.close();
        toast('抢购次数已更新');
        await loadAccounts();
      } catch (e) {
        toast(e.message || String(e));
      }
    });

    addLevelForm.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      if (!addingAccountId) return;
      try {
        await apiJson(`/api/accounts/${addingAccountId}/levels`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            vipLevel: addLevelVip.value,
            targetCount: Number(addLevelTarget.value) || 1,
          }),
        });
        addLevelDlg.close();
        toast('已添加抢购等级');
        await loadAccounts();
      } catch (e) {
        toast(e.message || String(e));
      }
    });

    document.getElementById('buyerForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      if (!editingBuyerId) return;
      try {
        await apiJson(`/api/accounts/${editingBuyerId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            buyerNickname: document.getElementById('buyerInput').value || '',
          }),
        });
        document.getElementById('buyerDlg').close();
        toast('买家昵称已更新');
        await loadAccounts();
      } catch (e) {
        toast(e.message || String(e));
      }
    });

    document.getElementById('editCancel').addEventListener('click', () => editDlg.close());
    document.getElementById('addLevelCancel').addEventListener('click', () => addLevelDlg.close());
    document.getElementById('buyerCancel').addEventListener('click', () => document.getElementById('buyerDlg').close());
    document.getElementById('filterMobile').addEventListener('input', () => applyFilters());
    document.getElementById('filterStatus').addEventListener('change', () => applyFilters());
    document.getElementById('btnClearFilter').addEventListener('click', () => {
      document.getElementById('filterMobile').value = '';
      document.getElementById('filterStatus').value = 'active';
      applyFilters();
    });
    document.getElementById('btnRefresh').addEventListener('click', () => loadAccounts());

    document.getElementById('btnCheckOnline').addEventListener('click', async () => {
      const btn = document.getElementById('btnCheckOnline');
      if (btn.disabled) return;
      btn.disabled = true;
      const prevText = btn.textContent;
      btn.textContent = '验证中…';
      toast('正在验证可用账号在线情况（跳过已完成）…', 10000);
      try {
        const data = await apiJson('/api/accounts/check-online', { method: 'POST' });
        onlineCheckMap.clear();
        for (const r of data.results || []) {
          onlineCheckMap.set(Number(r.id), {
            online: !!r.online,
            message: r.message || (r.online ? '在线' : '离线'),
          });
        }
        const offlineSample = (data.results || [])
          .filter((r) => !r.online)
          .slice(0, 5)
          .map((r) => r.mobile || r.id)
          .join('、');
        let msg = data.message || `在线 ${data.online}，离线 ${data.offline}`;
        if (data.offline > 0 && offlineSample) {
          msg += `；离线示例：${offlineSample}${data.offline > 5 ? '…' : ''}`;
        }
        toast(msg, 6000);
        await loadAccounts();
      } catch (e) {
        toast(e.message || String(e), 4000);
      } finally {
        btn.disabled = false;
        btn.textContent = prevText;
      }
    });

    loadAccounts();
  </script>
</body>
</html>
